apiVersion: apps/v1
kind: Deployment
metadata:
  name: websphere-cafe
  namespace: websphere-cafe
  labels:
    app: websphere-cafe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: websphere-cafe
  template:
    metadata:
      labels:
        app: websphere-cafe
    spec:
      containers:
      - name: websphere-cafe
        image: websphere-cafe:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9080
          name: http
        - containerPort: 9443
          name: https
        env:
        - name: DB_SERVER
          valueFrom:
            configMapKeyRef:
              name: websphere-cafe-config
              key: DB_SERVER
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: websphere-cafe-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: websphere-cafe-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: websphere-cafe-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: websphere-cafe-secret
              key: DB_PASSWORD
        livenessProbe:
          httpGet:
            path: /websphere-cafe/health
            port: 9080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /websphere-cafe/health
            port: 9080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: websphere-cafe-service
  namespace: websphere-cafe
spec:
  selector:
    app: websphere-cafe
  ports:
  - name: http
    port: 80
    targetPort: 9080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 9443
    protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: websphere-cafe-ingress
  namespace: websphere-cafe
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: websphere-cafe.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: websphere-cafe-service
            port:
              number: 80